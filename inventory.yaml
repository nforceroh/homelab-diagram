meta:
  title: My Homelab
  title_redacted: My Homelab
  date: November 2026
  watermark: u/goblinmine
  domain: example.com
redact:
  domain: true
  domain_placeholder: redacted.com
  ssid_names: true
vlans:
- key: '10'
  tag: VLAN 10
  name: LAN
  subnet: 10.0.10.0/24
  color: '#58a6ff'
  note: "trusted \xB7 may manage the other VLANs"
- key: '20'
  tag: VLAN 20
  name: DMZ
  subnet: 10.0.20.0/24
  color: '#f0883e'
  note: "services \xB7 no access to LAN, GUEST or MGMT"
- key: '30'
  tag: VLAN 30
  name: GUEST
  subnet: 10.0.30.0/24
  color: '#bc8cff'
  note: "internet only \xB7 plus the NAS public share"
- key: '40'
  tag: VLAN 40
  name: IoT
  subnet: 10.0.40.0/24
  color: '#3fb950'
  note: "internet only \xB7 HA gets a few narrow holes"
- key: '99'
  tag: VLAN 99
  name: MGMT
  subnet: 10.0.99.0/24
  color: '#e3b341'
  note: "admin interfaces \xB7 only from LAN and VPN"
- key: vpn
  tag: WireGuard
  name: VPN
  subnet: 10.0.50.0/24
  color: '#39c5cf'
  note: "split tunnel \xB7 LAN-like access, no internet"
- key: wan
  tag: Fritzbox
  name: WAN
  subnet: 192.168.178.0/24
  color: '#f85149'
  note: "untrusted \xB7 OPNsense's uplink to the Fritzbox"
internet:
  speed:
    down: 600 Mbit/s
    up: 50 Mbit/s
  cloud_services:
  - icon: cloudflare
    name: Cloudflare
    note: "DNS \xB7 *.{domain} \xB7 DNS-01 wildcard cert"
  - icon: backblaze
    name: Backblaze B2
    note: offsite copy of NAS data
devices: {}
ssids:
- name: Home
  redacted: Home
  vlan: '10'
- name: Guest
  redacted: Guest
  vlan: '30'
- name: IoT
  redacted: IoT
  vlan: '40'
remote:
  name: Remote access
  note: "phone + laptop \xB7 WireGuard VPN"
port_forwards:
- port: 80, 443
  proto: TCP/UDP
  to: Traefik
  what: every *.{domain} site
- port: '22'
  proto: TCP
  to: Forgejo
  what: "git over SSH (\u2192 :2222)"
- port: '1024'
  proto: TCP
  to: TrueNAS
  what: key-only SFTP backups
- port: '51820'
  proto: UDP
  to: WireGuard
  what: remote access VPN
- port: '64001'
  proto: TCP/UDP
  to: qBittorrent
  what: incoming peers
opnsense:
  name: OPNsense
  type: router/firewall
  model: Unknown
  os: OPNsense X.Y
switch_brocade1:
  name: Brocade1
  type: switch
  model: Brocade ICX 7250
  os: Brocade switch OS
  ip: 192.168.101.7
  internal: brocade1
  config: configured as pure L2 switch
  ports: []
switch_brocade2:
  name: Brocade2
  type: switch
  model: Brocade ICX 6450
  os: Brocade switch OS
  ip: 192.168.101.6
  internal: brocade2
  config: configured as pure L2 switch
  ports: []
ap_zyxel01:
  name: zyxel01
  type: access point
  model: OpenWrt x86_64
  vlan: '10'
  trunk: false
  ip: zyxel01.v101.nf.lab
  internal: zyxel01
  icons:
  - openwrt
  hw:
    hostname: zyxel01
    radios: 0
    ssids: 1
  ssids: []
ap_zyxel02:
  name: zyxel02
  type: access point
  model: OpenWrt x86_64
  vlan: '10'
  trunk: false
  ip: zyxel02.v101.nf.lab
  internal: zyxel02
  icons:
  - openwrt
  hw:
    hostname: zyxel02
    radios: 0
    ssids: 1
  ssids: []
