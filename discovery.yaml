# Discovery template for homelab inventory.
# Fill in your infrastructure details and run `python3 build.py --inventory discovery.yaml`
# to generate a temporary inventory, or merge the values into inventory.yaml manually.

# ============================================================
# Internet edge
# ============================================================
internet:
  speed:
    down: "1000 Mbit/s"   # your down speed
    up: "100 Mbit/s"      # your up speed
  cloud_services:
    - {icon: cloudflare, name: "Cloudflare", note: "DNS · *.{domain} · DNS-01 wildcard cert"}
    - {icon: backblaze,  name: "Offsite backup", note: "Copy of NAS data"}

# ============================================================
# Firewall / router
# ============================================================
opnsense:
  name: "OPNsense"
  type: "router/firewall"
  model: "Your model"          # e.g. "Lenovo thin client"
  os: "OPNsense X.Y"           # e.g. "OPNsense 26.7"
  hw:
    - {icon: glyph-cpu, label: "CPU",     value: "CPU model",     sub: "cores · threads"}
    - {icon: glyph-ram, label: "MEMORY",  value: "RAM size",      sub: "info"}
    - {icon: glyph-nic, label: "NETWORK", value: "NIC model",     sub: "info"}
    - {icon: glyph-nic, label: "NETWORK", value: "NIC model",     sub: "info"}
  ip: "10.0.99.1"              # mgmt IP
  internal: opnsense
  nic_note: "e.g. LACP · dual 2.5G Intel"
  wan_ip: ".1"                 # host part only
  services:
    - {icon: adguard,      name: "AdGuard Home", note: "DNS for all VLANs"}
    - {icon: glyph-dhcp,   name: "dnsmasq",      note: "DHCP + *.internal"}
    - {icon: wireguard,    name: "WireGuard",    note: "wg0 · UDP 51820"}
    - {icon: glyph-shield, name: "Suricata IPS", note: "outbound inspection"}
    - {icon: crowdsec,     name: "CrowdSec",     note: "LAPI + pf bouncer"}
    - {icon: glyph-block,  name: "pf blocklist", note: "~2.3k bad IPs on WAN"}

# ============================================================
# Switches (you can have multiple; each gets its own section)
# ============================================================
# switch1:
#   name: "Brocade X"
#   type: "switch"
#   model: "Brocade model"
#   ip: "10.0.99.2"
